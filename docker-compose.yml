# AuditAI — stack completa (produção self-hosted)
#
# Uso:
#   docker compose up -d --build                 # núcleo: db + redis + api + web
#   docker compose --profile worker up -d        # + celery worker (digest/emails)
#   docker compose --profile ai up -d            # + EXAONE 4.0 via llama.cpp + Qdrant
#
# O modelo EXAONE 4.0 1.2B GGUF é descarregado automaticamente no primeiro arranque.
# Ollama continua disponível opcionalmente no perfil separado "ollama".
#
# Serviços: frontend :3000 · backend :8000 · postgres :5432 · redis :6379
#           (perfil ai) EXAONE :8080 · qdrant :6333 · (ollama) :11434

services:
  # ── 1. Base de dados ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: audit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audit}
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit} -d ${POSTGRES_DB:-audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. Broker/Cache (Celery + throttling) ───────────────────────────
  redis:
    image: redis:alpine
    container_name: audit_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 3. API Django (gunicorn) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit_backend
    environment:
      AUDIT_DEBUG: "False"
      AUDIT_ALLOWED_HOSTS: ${AUDIT_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      AUDIT_DJANGO_SECRET_KEY: ${AUDIT_DJANGO_SECRET_KEY:?Set AUDIT_DJANGO_SECRET_KEY in .env}
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-audit}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUDIT_CELERY_TASK_ALWAYS_EAGER: "False"
      AUDIT_CORS_ALLOW_ALL: "False"
      AUDIT_CORS_ORIGINS: ${AUDIT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUDIT_SSL_REDIRECT: ${AUDIT_SSL_REDIRECT:-False}
      AUDIT_EMAIL_BACKEND: ${AUDIT_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      AUDIT_DIGEST_EMAILS: ${AUDIT_DIGEST_EMAILS:-}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      AUDIT_LLM_API_STYLE: ${AUDIT_LLM_API_STYLE:-openai-compatible}
      AUDIT_LLM_BASE_URL: ${AUDIT_LLM_BASE_URL:-http://exaone:8080/v1}
      AUDIT_OLLAMA_MODEL: ${AUDIT_OLLAMA_MODEL:-exaone4.0-1.2b}
      AUDIT_LLM_API_KEY: ${AUDIT_LLM_API_KEY:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 4. Dashboard Next.js ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: http://backend:8000
    container_name: audit_frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── 5. Celery worker (perfil "worker") — digest, emails, agents ─────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit_celery
    command: ["celery", "-A", "auditportal", "worker", "--loglevel=info"]
    environment:
      AUDIT_DJANGO_SECRET_KEY: ${AUDIT_DJANGO_SECRET_KEY:?Set AUDIT_DJANGO_SECRET_KEY in .env}
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-audit}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUDIT_CELERY_TASK_ALWAYS_EAGER: "False"
      AUDIT_EMAIL_BACKEND: ${AUDIT_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      AUDIT_DIGEST_EMAILS: ${AUDIT_DIGEST_EMAILS:-}
      AUDIT_DIGEST_ENABLED: ${AUDIT_DIGEST_ENABLED:-True}
      AUDIT_ALERTS_ENABLED: ${AUDIT_ALERTS_ENABLED:-True}
      AUDIT_DIGEST_HOUR: ${AUDIT_DIGEST_HOUR:-7}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      AUDIT_LLM_API_STYLE: ${AUDIT_LLM_API_STYLE:-openai-compatible}
      AUDIT_LLM_BASE_URL: ${AUDIT_LLM_BASE_URL:-http://exaone:8080/v1}
      AUDIT_OLLAMA_MODEL: ${AUDIT_OLLAMA_MODEL:-exaone4.0-1.2b}
      AUDIT_LLM_API_KEY: ${AUDIT_LLM_API_KEY:-}
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    profiles: ["worker"]
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit_celery_beat
    command: ["celery", "-A", "auditportal", "beat", "--loglevel=info"]
    environment:
      AUDIT_DJANGO_SECRET_KEY: ${AUDIT_DJANGO_SECRET_KEY:?Set AUDIT_DJANGO_SECRET_KEY in .env}
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-audit}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUDIT_CELERY_TASK_ALWAYS_EAGER: "False"
      AUDIT_DIGEST_ENABLED: ${AUDIT_DIGEST_ENABLED:-True}
      AUDIT_ALERTS_ENABLED: ${AUDIT_ALERTS_ENABLED:-True}
      AUDIT_DIGEST_HOUR: ${AUDIT_DIGEST_HOUR:-7}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    profiles: ["worker"]
    restart: unless-stopped

  # ── 6. EXAONE 4.0 1.2B — servidor llama.cpp (perfil "ai") ────────────
  # Modelo GGUF quantizado Q4_K_M, carregado pelo servidor OpenAI-compatible.
  exaone:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: audit_exaone
    command:
      - "-hf"
      - "LGAI-EXAONE/EXAONE-4.0-1.2B-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "exaone4.0-1.2b"
      - "-c"
      - "8192"
      - "--jinja"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - exaone_data:/models
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    profiles: ["ai"]
    restart: unless-stopped

  # ── Ollama alternativo (perfil "ollama") ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: audit_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles: ["ollama"]
    restart: unless-stopped

  # ── 7. Qdrant — vector DB para RAG (perfil "ai") ────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["ai"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  ollama_data:
  exaone_data:
  qdrant_data:
