version: '3.8'

services:
  # 1. AI Inference Engine (Ollama)
  # Runs DeepSeek-R1-Distill-Llama-8B
  ollama:
    image: ollama/ollama:latest
    container_name: audit_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  # 2. Vector Database (Qdrant)
  # Stores embeddings for RAG (Corporate Brain)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # 3. Message Broker (Redis)
  # For Celery tasks (Email/Slack notifications)
  redis:
    image: redis:alpine
    container_name: audit_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  ollama_data:
  qdrant_data:
