# AuditAI — stack completa (produção self-hosted)
#
# Uso:
#   docker compose up -d --build                 # núcleo: db + redis + api + web
#   docker compose --profile worker up -d        # + celery worker (digest/emails)
#   docker compose --profile ai up -d            # + Ollama (LLM) + Qdrant (RAG)
#
# LLM (opcional, perfil "ai"):
#   docker compose exec ollama ollama pull deepseek-r1:8b
#   → e definir AUDIT_OLLAMA_MODEL=deepseek-r1:8b no .env
#
# Serviços: frontend :3000 · backend :8000 · postgres :5432 · redis :6379
#           (perfil ai) ollama :11434 · qdrant :6333

services:
  # ── 1. Base de dados ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: audit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audit}
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit} -d ${POSTGRES_DB:-audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. Broker/Cache (Celery + throttling) ───────────────────────────
  redis:
    image: redis:alpine
    container_name: audit_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 3. API Django (gunicorn) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit_backend
    environment:
      AUDIT_DEBUG: "False"
      AUDIT_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0"
      AUDIT_DJANGO_SECRET_KEY: ${AUDIT_DJANGO_SECRET_KEY:-change-me-in-production}
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:-audit_change_me}@postgres:5432/${POSTGRES_DB:-audit}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUDIT_CORS_ALLOW_ALL: "False"
      AUDIT_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUDIT_EMAIL_BACKEND: ${AUDIT_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      AUDIT_DIGEST_EMAILS: ${AUDIT_DIGEST_EMAILS:-}
      OLLAMA_URL: http://ollama:11434
      AUDIT_OLLAMA_MODEL: ${AUDIT_OLLAMA_MODEL:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 4. Dashboard Next.js ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: http://backend:8000
    container_name: audit_frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── 5. Celery worker (perfil "worker") — digest, emails, agents ─────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: audit_celery
    command: ["celery", "-A", "auditportal", "worker", "--loglevel=info"]
    environment:
      AUDIT_DJANGO_SECRET_KEY: ${AUDIT_DJANGO_SECRET_KEY:-change-me-in-production}
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:-audit_change_me}@postgres:5432/${POSTGRES_DB:-audit}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUDIT_EMAIL_BACKEND: ${AUDIT_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      AUDIT_DIGEST_EMAILS: ${AUDIT_DIGEST_EMAILS:-}
      AUDIT_DIGEST_ENABLED: ${AUDIT_DIGEST_ENABLED:-False}
      AUDIT_DIGEST_HOUR: ${AUDIT_DIGEST_HOUR:-7}
      OLLAMA_URL: http://ollama:11434
      AUDIT_OLLAMA_MODEL: ${AUDIT_OLLAMA_MODEL:-}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["worker"]
    restart: unless-stopped

  # ── 6. Ollama — LLM self-hosted (perfil "ai") ───────────────────────
  # CPU por defeito. Em hosts com NVIDIA Container Toolkit, descomentar
  # o bloco "deploy" abaixo para aceleração GPU.
  ollama:
    image: ollama/ollama:latest
    container_name: audit_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles: ["ai"]
    restart: unless-stopped

  # ── 7. Qdrant — vector DB para RAG (perfil "ai") ────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["ai"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  ollama_data:
  qdrant_data:
