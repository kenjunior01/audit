name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  backend:
    name: Backend PyInstaller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build do executável
        working-directory: desktop-backend
        run: pyinstaller audit-backend.spec --noconfirm --clean

      - name: Smoke test (arranca e responde ao health)
        if: runner.os != 'Windows'
        working-directory: desktop-backend
        shell: bash
        run: |
          ./dist/audit-backend &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/django/api/health > /dev/null 2>&1; then
              echo "health OK"; exit 0
            fi
            sleep 2
          done
          echo "backend não respondeu ao health a tempo"; exit 1

      - name: Upload artifact (backend ${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            desktop-backend/dist/audit-backend
            desktop-backend/dist/audit-backend.exe
          if-no-files-found: error
          retention-days: 3

  frontend:
    name: Frontend standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build standalone
        working-directory: frontend
        run: npm run build

      - name: Preparar pacote standalone (server.js + static + public)
        working-directory: frontend
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cd .next/standalone
          tar -czf ../../frontend-standalone.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone
          path: frontend/frontend-standalone.tar.gz
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: App desktop (${{ matrix.os }})
    needs: [backend, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend_art: backend-windows-latest
            backend_bin: audit-backend.exe
          - os: ubuntu-latest
            backend_art: backend-ubuntu-latest
            backend_bin: audit-backend
          - os: macos-latest
            backend_art: backend-macos-latest
            backend_bin: audit-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descarregar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Preparar resources do Electron
        shell: bash
        run: |
          set -e
          mkdir -p desktop/resources/backend desktop/resources/frontend
          cp "artifacts/${{ matrix.backend_art }}/${{ matrix.backend_bin }}" \
             desktop/resources/backend/
          chmod +x desktop/resources/backend/* 2>/dev/null || true
          tar -xzf artifacts/frontend-standalone/frontend-standalone.tar.gz \
              -C desktop/resources/frontend
          ls -la desktop/resources/backend desktop/resources/frontend | head -20

      - name: Instalar dependências do Electron
        working-directory: desktop
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Empacotar (electron-builder)
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi

      - name: Upload do instalador
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar Release
    needs: desktop
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: false

      - name: Criar release com os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: AuditAI Desktop — build ${{ github.run_number }}
          body: |
            Instaladores da aplicação desktop (Electron + backend Django embutido).

            - **Windows**: `AuditAI Setup *.exe` (instalador) ou `*.exe` portable
            - **Linux**: `AuditAI-*.AppImage`
            - **macOS**: `AuditAI-*.dmg`

            Primeira execução: cria base de dados local com dados demo
            (login: `demo@audit.pt` / `demo1234`).
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
          draft: false
          prerelease: true
