name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Django — check + migrações + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: System check
        run: python manage.py check

      - name: Migrações em sincronia com os modelos
        run: python manage.py makemigrations --check --dry-run

      - name: Testes (suítes explícitas)
        run: |
          python manage.py test \
            dashboard.tests.test_copilot_v8 \
            dashboard.tests.test_copilot_v7 \
            dashboard.tests.test_copilot_v6 \
            dashboard.tests.test_copilot_v5 \
            dashboard.tests.test_copilot_v4 \
            dashboard.tests.test_copilot_v3 \
            dashboard.tests.test_copilot \
            dashboard.tests.test_excel_copilot \
            dashboard.tests.test_excel_studio \
            dashboard.tests.test_critical_flows \
            dashboard.tests.test_health

  frontend:
    name: Next.js — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build de produção
        run: npm run build
